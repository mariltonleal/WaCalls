# Painel do WaCalls atrás do Apache do FreePBX: https://<host>/wacalls/
# Requer: a2enmod proxy proxy_http auth_basic
<Location /wacalls/>
    ProxyPass        http://127.0.0.1:8090/
    ProxyPassReverse http://127.0.0.1:8090/
    ProxyPreserveHost Off
    AuthType Basic
    AuthName "WaCalls"
    AuthUserFile /etc/apache2/wacalls.htpasswd
    Require valid-user
    # A API não usa o header Authorization; não vaza a senha do painel.
    RequestHeader unset Authorization
</Location>
